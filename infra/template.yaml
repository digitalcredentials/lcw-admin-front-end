AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Hosting for the LCW admin console: a private S3 bucket behind CloudFront at
  DomainName (admin.lcw-sandbox.org), with its certificate validated through
  the hosted zone and the alias records written there. Deployed in us-east-1,
  where CloudFront requires its certificate to live.

Parameters:
  DomainName:
    Type: String
    Description: Host the console is served at (e.g. admin.lcw-sandbox.org).
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone holding DomainName.

Resources:
  # Reached only through CloudFront (origin access control below); never a
  # website endpoint, never public.
  ConsoleBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ConsoleOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-console
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ConsoleCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  ConsoleDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub LCW admin console (${DomainName})
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: console
            DomainName: !GetAtt ConsoleBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ConsoleOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        # Hashed assets: cached. The console's pages are # routes, so every
        # page is index.html and no path needs a fallback.
        DefaultCacheBehavior:
          TargetOriginId: console
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          Compress: true
          # Managed CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed SecurityHeadersPolicy: HSTS, nosniff, frame and referrer
          # restrictions
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CacheBehaviors:
          # The shell names the current hashed assets, so it is never cached:
          # a deploy removes the old ones, and a stale shell would ask for them.
          - PathPattern: /index.html
            TargetOriginId: console
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            Compress: true
            # Managed CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        ViewerCertificate:
          AcmCertificateArn: !Ref ConsoleCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  # Only this distribution may read the bucket.
  ConsoleBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ConsoleBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${ConsoleBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ConsoleDistribution}

  ConsoleDnsA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        # CloudFront's fixed hosted zone
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt ConsoleDistribution.DomainName

  ConsoleDnsAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt ConsoleDistribution.DomainName

Outputs:
  BucketName:
    Description: Where the built console is synced to
    Value: !Ref ConsoleBucket
  DistributionId:
    Description: The distribution to invalidate after a deploy
    Value: !Ref ConsoleDistribution
  ConsoleUrl:
    Value: !Sub https://${DomainName}
